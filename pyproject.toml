[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-energy-dispatch"
version = "0.0.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary]",
    "numpy",
    "pandas",
    "openpyxl",
    "scipy",
    "gurobipy",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]