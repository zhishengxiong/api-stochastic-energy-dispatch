[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-stochastic-energy-dispatch"
version = "0.0.0"
description = "API for running and managing two-stage stochastic energy dispatch in distribution networks."
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary]",
    "numpy",
    "pandas",
    "openpyxl",
    "scipy",
    "gurobipy",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
test = [
    "pytest",
    "ruff",
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
