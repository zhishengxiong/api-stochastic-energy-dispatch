name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-stochastic-energy-dispatch .

      - name: Start API container
        run: |
          docker run -d \
            --name tssp-api \
            -p 8000:8000 \
            -e DB_HOST=dummy \
            -e DB_PORT=5432 \
            -e DB_NAME=dummy \
            -e DB_USER=dummy \
            -e DB_PASSWORD=dummy \
            api-stochastic-energy-dispatch

      - name: Wait for API
        run: sleep 5

      - name: Test API health endpoint
        run: curl --fail http://localhost:8000/
