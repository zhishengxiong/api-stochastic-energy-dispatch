name: CI

# Run CI when code is pushed to main
# or when a pull request targets main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # Check Python code quality and run automated tests.
  test:
    runs-on: ubuntu-latest

    steps:
      # Download the repository code to the GitHub runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the Python version used by this project.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the project together with testing tools
      # defined in pyproject.toml.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # Check code style and common Python issues.
      - name: Run Ruff
        run: python -m ruff check .

      # Check whether source files follow Ruff formatting.
      - name: Check formatting
        run: python -m ruff format --check .

      # Run the automated test suite.
      - name: Run tests
        run: pytest

  # Verify that the application can be packaged and started
  # successfully inside Docker.
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the same Docker image that is used locally.
      - name: Build Docker image
        run: docker build -t api-stochastic-energy-dispatch .

      # Start the API container.
      # Dummy database settings are sufficient here because
      # the health endpoint does not access PostgreSQL.
      - name: Start API container
        run: |
          docker run -d \
            --name tssp-api \
            -p 8000:8000 \
            -e DB_HOST=dummy \
            -e DB_PORT=5432 \
            -e DB_NAME=dummy \
            -e DB_USER=dummy \
            -e DB_PASSWORD=dummy \
            api-stochastic-energy-dispatch

      # Give Uvicorn a few seconds to start.
      - name: Wait for API
        run: sleep 5

      # Smoke test: verify that FastAPI is actually reachable.
      - name: Test API health endpoint
        run: curl --fail http://localhost:8000/
